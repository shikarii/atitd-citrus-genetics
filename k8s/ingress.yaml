apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: citrus-genetics
  namespace: citrus-genetics
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  rules:
    - host: localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 80
