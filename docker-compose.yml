services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    expose:
      - "8000"                          # Internal only — not published to the host
    volumes:
      - ./results:/app/results:ro       # Run snapshots; no data/ mount — children.csv lives in the snapshot
    healthcheck:
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    ports:
      - "127.0.0.1:80:80"              # Localhost only — not accessible from LAN
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:80/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
